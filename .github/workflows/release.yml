name: build and release VC-code extension server binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: CodeMate-AI/CLIENT_SERVER
          token: ${{secrets.ACCESS_TOKEN}}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Poetry
        run: pip install poetry
      
      - name: Setup Project 
        run: |
          make install 
          make setup
      
      - name: Check Makefile and build process
        run: |
          echo "=== Makefile contents ==="
          cat Makefile
          echo "=== End of Makefile ==="
          
          # Check pyproject.toml if it exists
          if [ -f "pyproject.toml" ]; then
            echo "=== pyproject.toml contents ==="
            cat pyproject.toml
            echo "=== End of pyproject.toml ==="
          fi
          
          # Check if there's a build script
          if [ -f "build.py" ]; then
            echo "=== build.py contents ==="
            cat build.py
            echo "=== End of build.py ==="
          fi
        shell: bash
      
      - name: Build binary
        run: |
          echo "Starting build process..."
          # Run make build with verbose output if possible
          make build V=1 VERBOSE=1 || make build
          echo "Build process completed. Checking results..."
          
          # Check if dist directory exists
          if [ ! -d "dist" ]; then
            echo "Warning: 'dist' directory not found after build!"
            echo "Current directory contents:"
            ls -la
          else
            echo "dist directory exists. Contents:"
            ls -la dist
          fi
        shell: bash
      
      - name: List build artifacts
        run: |
          echo "Listing directory structure:"
          find dist -type d | sort
          echo "---------------------"
          echo "Listing files in dist directory (limited to first 30):"
          find dist -type f | sort | head -n 30
        shell: bash
      
      - name: Explore directory structure for Windows
        if: matrix.os == 'windows-latest'
        run: |
          echo "Looking for Windows binaries:"
          dir dist /s /b | findstr ".exe"
        shell: cmd
      
      - name: Explore directory structure for macOS
        if: matrix.os == 'macos-latest'
        run: |
          echo "Looking for macOS binaries:"
          find dist -type f -name "server" -o -name "*.bin" | xargs ls -la
        shell: bash
      
      - name: Rename Artifacts (windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Try direct path first
          if [ -f "dist/server.exe" ]; then
            BINARY_PATH="dist/server.exe"
          elif [ -f "dist/win32/server.exe" ]; then
            BINARY_PATH="dist/win32/server.exe"
          elif [ -f "dist/win64/server.exe" ]; then
            BINARY_PATH="dist/win64/server.exe"
          elif [ -f "dist/windows/server.exe" ]; then
            BINARY_PATH="dist/windows/server.exe"
          else
            # Fall back to find
            echo "Searching for EXE files:"
            FOUND_FILES=$(find dist -name "*.exe" -type f 2>/dev/null || echo "")
            echo "$FOUND_FILES"
            BINARY_PATH=$(echo "$FOUND_FILES" | grep -i server | head -n 1)
          fi
          
          if [ -z "$BINARY_PATH" ] || [ ! -f "$BINARY_PATH" ]; then
            echo "Error: No server executable found"
            exit 1
          fi
          
          echo "Found Windows binary at: $BINARY_PATH"
          cp "$BINARY_PATH" "client-server-${{ matrix.os }}-${{ github.event.inputs.version }}.exe"
        shell: bash
      
      - name: Rename Artifacts (macos)
        if: matrix.os == 'macos-latest'
        run: |
          # Try direct path first
          if [ -f "dist/server" ]; then
            BINARY_PATH="dist/server"
          elif [ -f "dist/darwin/server" ]; then
            BINARY_PATH="dist/darwin/server"
          elif [ -f "dist/macos/server" ]; then
            BINARY_PATH="dist/macos/server"
          else
            # Fall back to find with limited output
            echo "Searching for executable files:"
            FOUND_FILES=$(find dist -maxdepth 3 -type f -perm +111 2>/dev/null || echo "")
            echo "$FOUND_FILES"
            BINARY_PATH=$(echo "$FOUND_FILES" | grep -i server | head -n 1)
          fi
          
          if [ -z "$BINARY_PATH" ] || [ ! -f "$BINARY_PATH" ]; then
            echo "Error: No server executable found"
            exit 1
          fi
          
          echo "Found macOS binary at: $BINARY_PATH"
          cp "$BINARY_PATH" "client-server-${{ matrix.os }}-${{ github.event.inputs.version }}"
        shell: bash
      
      - name: Upload Artifact (macos)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{matrix.os}}
          path: client-server-${{matrix.os}}-${{ github.event.inputs.version }}
      
      - name: Upload Artifact (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{matrix.os}}
          path: client-server-${{matrix.os}}-${{ github.event.inputs.version }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Git Tag
        env: 
            GITHUB_TOKEN: ${{secrets.ACCESS_TOKEN}}
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Downloaded Files
        run: ls -R artifacts

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: "Automated release for version v${{ github.event.inputs.version }}"
          draft: false
          prerelease: false
          files: artifacts/binaries-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
